name: tests

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php:
        name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12', '13']
                include:
                    - laravel: '12'
                      testbench: '10.*'
                    - laravel: '13'
                      testbench: '11.*'
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_sqlite
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
                  composer update --prefer-dist --no-interaction --no-progress

            - name: Pint
              if: matrix.php == '8.5' && matrix.laravel == '13'
              run: vendor/bin/pint --test

            - name: PHPStan
              if: matrix.php == '8.5' && matrix.laravel == '13'
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Tests (SQLite)
              run: vendor/bin/pest

    databases:
        name: MySQL 8.4 · Postgres 17
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: testing
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
                    --health-interval=5s --health-timeout=5s --health-retries=20
            postgres:
                image: postgres:17
                env:
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: testing
                ports: ['5432:5432']
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=5s --health-timeout=5s --health-retries=20
        env:
            DB_HOST: 127.0.0.1
            DB_DATABASE: testing
            DB_PASSWORD: password
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: pdo_mysql, pdo_pgsql
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Tests (MySQL)
              run: vendor/bin/pest
              env:
                  DB_CONNECTION: mysql
                  DB_PORT: 3306
                  DB_USERNAME: root

            - name: Tests (Postgres)
              run: vendor/bin/pest
              env:
                  DB_CONNECTION: pgsql
                  DB_PORT: 5432
                  DB_USERNAME: postgres

    frontend:
        name: Registry
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Format and lint
              run: pnpm exec vp check

            - name: Tests
              run: pnpm exec vp test run

            - name: Types
              run: pnpm exec tsc --noEmit

            - name: Compiled registry is up to date
              run: |
                  pnpm exec shadcn build -o r
                  git diff --exit-code -- r/
