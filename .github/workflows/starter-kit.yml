name: starter kit

# Installs the package in a clean React starter kit. It also runs every week because the
# installer uses shadcn@latest and the starter kit changes without this repo changing.
on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    react:
        name: React starter kit (${{ matrix.package-manager }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package-manager: [npm, pnpm]
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: pdo_sqlite
                  coverage: none

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*

            - name: Install and check like a user
              run: .github/scripts/starter-kit.sh ${{ matrix.package-manager }} "$RUNNER_TEMP/app"

            - name: e2e tests in the browser
              if: matrix.package-manager == 'pnpm'
              env:
                  E2E_APP_DIR: ${{ runner.temp }}/app
              run: |
                  pnpm install --frozen-lockfile
                  pnpm exec playwright install --with-deps chromium
                  tests/e2e/setup.sh "$E2E_APP_DIR"
                  pnpm run test:e2e

            - name: Upload the Playwright report
              if: failure() && matrix.package-manager == 'pnpm'
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
