name: starter kit

# Instala el paquete en un starter kit de React limpio. Corre también cada semana porque
# el instalador usa shadcn@latest y el starter kit cambia sin que cambie este repo.
on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    react:
        name: React starter kit (${{ matrix.package-manager }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package-manager: [npm, pnpm]
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: pdo_sqlite
                  coverage: none

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*

            - name: Install and check like a user
              run: .github/scripts/starter-kit.sh ${{ matrix.package-manager }} "$RUNNER_TEMP/app"
